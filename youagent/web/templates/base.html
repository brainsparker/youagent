<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}YouAgent{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex">
  <!-- Sidebar -->
  <nav class="w-56 bg-slate-800 border-r border-slate-700 p-4 flex flex-col gap-1 fixed h-full">
    <div class="mb-6">
      <h1 class="text-xl font-bold text-white">YouAgent</h1>
      <p class="text-xs text-slate-400">Intelligence Network</p>
    </div>
    <a href="/" class="px-3 py-2 rounded hover:bg-slate-700 {% if active == 'dashboard' %}bg-slate-700 text-white{% endif %}">Dashboard</a>
    <a href="/agents" class="px-3 py-2 rounded hover:bg-slate-700 {% if active == 'agents' %}bg-slate-700 text-white{% endif %}">Agents</a>
    <a href="/feed" class="px-3 py-2 rounded hover:bg-slate-700 {% if active == 'feed' %}bg-slate-700 text-white{% endif %}">Feed</a>
    <a href="/interests" class="px-3 py-2 rounded hover:bg-slate-700 {% if active == 'interests' %}bg-slate-700 text-white{% endif %}">Interests</a>
    <a href="/network" class="px-3 py-2 rounded hover:bg-slate-700 {% if active == 'network' %}bg-slate-700 text-white{% endif %}">Network</a>
    <a href="/search" class="px-3 py-2 rounded hover:bg-slate-700 {% if active == 'search' %}bg-slate-700 text-white{% endif %}">Search</a>
    <div class="mt-auto pt-4 border-t border-slate-700 text-xs text-slate-500">
      v{{ version }}
    </div>
  </nav>

  <!-- Main content -->
  <main class="ml-56 flex-1 p-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
