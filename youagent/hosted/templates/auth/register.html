<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — YouAgent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md">
    <h1 class="text-2xl font-bold text-white text-center mb-6">Create Account</h1>
    {% if error %}
    <div class="bg-red-900 border border-red-700 rounded p-3 mb-4 text-sm text-red-300">{{ error }}</div>
    {% endif %}
    <form method="post" action="/auth/register" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Email</label>
        <input type="email" name="email" required
          class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:border-cyan-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Password</label>
        <input type="password" name="password" required minlength="6"
          class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:border-cyan-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Confirm Password</label>
        <input type="password" name="confirm_password" required minlength="6"
          class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:border-cyan-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-700 py-2 rounded text-white font-semibold">Register</button>
    </form>
    <p class="text-center mt-4 text-sm text-slate-500">
      Already have an account? <a href="/auth/login" class="text-cyan-400 hover:underline">Sign in</a>
    </p>
  </div>
</body>
</html>
