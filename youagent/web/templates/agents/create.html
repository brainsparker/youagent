{% extends "base.html" %}
{% block title %}New Agent — YouAgent{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">Create Agent</h2>

<!-- Natural Language Onboarding -->
<div class="mb-8">
  <h3 class="text-lg font-semibold mb-3">Quick Setup</h3>
  <p class="text-sm text-slate-400 mb-3">Describe what you want to track in plain English.</p>
  <div class="flex gap-2">
    <textarea id="onboard-text" rows="3" placeholder='e.g. "I want to track AI regulation news, open source LLM releases, and venture capital trends in climate tech"'
      class="flex-1 bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:border-cyan-500 focus:outline-none"></textarea>
    <button onclick="onboard()" class="bg-cyan-600 hover:bg-cyan-700 px-6 py-2 rounded text-white self-end">Analyze</button>
  </div>
  <div id="onboard-preview" class="mt-4"></div>
</div>

<hr class="border-slate-700 mb-8">

<!-- Manual form -->
<h3 class="text-lg font-semibold mb-3">Manual Setup</h3>
<form hx-post="/agents" hx-target="body" class="max-w-lg space-y-4">
  <div>
    <label class="block text-sm text-slate-400 mb-1">Name</label>
    <input type="text" name="name" required
      class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:border-cyan-500 focus:outline-none">
  </div>
  <div>
    <label class="block text-sm text-slate-400 mb-1">Description</label>
    <textarea name="description" rows="2"
      class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:border-cyan-500 focus:outline-none"></textarea>
  </div>
  <div>
    <label class="block text-sm text-slate-400 mb-1">Interests (comma-separated taxonomy paths)</label>
    <input type="text" name="interests" placeholder="technology/ai/regulation, business/startups/funding"
      class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:border-cyan-500 focus:outline-none">
  </div>
  <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 px-6 py-2 rounded text-white">Create</button>
</form>

<script>
async function onboard() {
  const text = document.getElementById('onboard-text').value;
  if (!text.trim()) return;
  const preview = document.getElementById('onboard-preview');
  preview.innerHTML = '<p class="text-slate-400 text-sm">Analyzing...</p>';

  try {
    const resp = await fetch('/agents/onboard', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text})
    });
    const data = await resp.json();
    if (data.error) {
      preview.innerHTML = `<p class="text-red-400">${data.error}</p>`;
      return;
    }
    let html = `
      <div class="bg-slate-800 rounded-lg p-4 border border-cyan-800">
        <h4 class="font-bold text-white">${data.agent_name}</h4>
        <p class="text-sm text-slate-400 mt-1">${data.agent_description}</p>
        <div class="mt-3 space-y-2">`;
    for (const i of data.interests) {
      html += `
          <div class="bg-slate-700 rounded p-2">
            <span class="text-cyan-400 text-sm">${i.path}</span>
            <span class="text-xs text-slate-500 ml-2">${i.cadence} · ${i.priority}</span>
            <p class="text-xs text-slate-400 mt-1">${i.queries.join(', ')}</p>
          </div>`;
    }
    html += `</div>
        <form method="POST" action="/agents" class="mt-4">
          <input type="hidden" name="name" value="${data.agent_name}">
          <input type="hidden" name="description" value="${data.agent_description}">
          <input type="hidden" name="interests" value="${data.interests.map(i => i.path).join(',')}">
          <button type="submit" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-white text-sm">Create This Agent</button>
        </form>
      </div>`;
    preview.innerHTML = html;
  } catch (e) {
    preview.innerHTML = `<p class="text-red-400">Error: ${e.message}</p>`;
  }
}
</script>
{% endblock %}
