{% extends "base.html" %}
{% block title %}Setup — YouAgent{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-2">Welcome to YouAgent</h2>
<p class="text-slate-400 mb-8">Let's set up your first agent in 30 seconds.</p>

<form method="post" action="/onboarding" class="max-w-lg space-y-6">
  <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
    <h3 class="font-semibold text-white mb-3">1. You.com API Key <span class="text-slate-500 text-sm">(optional)</span></h3>
    <input type="text" name="api_key" placeholder="Your You.com API key"
      class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white text-sm focus:border-cyan-500 focus:outline-none">
    <p class="text-xs text-slate-500 mt-1">Leave blank to use the shared demo key.</p>
  </div>

  <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
    <h3 class="font-semibold text-white mb-3">2. Create Your Agent</h3>
    <div class="space-y-3">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Agent Name</label>
        <input type="text" name="agent_name" required placeholder="My Research Agent"
          class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white text-sm focus:border-cyan-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Interests (comma-separated)</label>
        <input type="text" name="agent_interests" placeholder="technology/ai/regulation, business/startups/funding"
          class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white text-sm focus:border-cyan-500 focus:outline-none">
      </div>
    </div>
  </div>

  <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 px-8 py-3 rounded text-white font-semibold">
    Launch My Agent
  </button>
</form>
{% endblock %}
